<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <script>
      (function() {
        var path = window.location.pathname;
        if (path && (path.indexOf('/payment/success') !== -1 || path.indexOf('/payment/cancel') !== -1)) {
          var search = window.location.search || '';
          var targetPage = path.indexOf('/payment/cancel') !== -1 ? '/pages/membership/index' : '/pages/payment/success';
          window.location.replace(window.location.origin + '/#' + targetPage + (search ? (search.charAt(0) === '?' ? search : '?' + search) : ''));
        }
      })();
    </script>
    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
