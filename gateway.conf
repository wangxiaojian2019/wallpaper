# ========================================================
# WallArt Gateway - 80 / 443 双端口与双子域名智能分流网关
# 1. 前台商城: wallpaper.icangoanyway.com (与 ios.icangoanyway.com) -> wallpaper-app:80 (5173)
# 2. 独立后台: admin.icangoanyway.com                             -> wallpaper-admin:80 (5174)
# ========================================================

# ========================================================
# HTTP (80端口): 前台商城 (wallpaper.icangoanyway.com)
# ========================================================
server {
    listen 80;
    server_name wallpaper.icangoanyway.com ios.icangoanyway.com;
    client_max_body_size 100M;

    # Certbot ACME 免费证书申请验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 客户端静态页面 (Uni-app 5173 前台商城)
    location / {
        proxy_pass http://wallpaper-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 接口统一转发至后端
    location /api/ {
        proxy_pass http://wallpaper-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态上传资源文件
    location /uploads/ {
        proxy_pass http://wallpaper-backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

# ========================================================
# HTTP (80端口): 独立管理后台 (admin.icangoanyway.com)
# ========================================================
server {
    listen 80;
    server_name admin.icangoanyway.com;
    client_max_body_size 100M;

    # Certbot ACME 免费证书申请验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 根路径访问自动重定向至后台管理系统
    location = / {
        return 302 /admin;
    }

    # 管理后台静态页面 (5174 后台)
    location / {
        proxy_pass http://wallpaper-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 接口
    location /api/ {
        proxy_pass http://wallpaper-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态上传资源文件
    location /uploads/ {
        proxy_pass http://wallpaper-backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

# ========================================================
# HTTP (80端口): 默认兜底服务 (默认访问 5173 前台)
# ========================================================
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 默认进入前台商城
    location / {
        proxy_pass http://wallpaper-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 二级路径访问后台
    location /admin {
        proxy_pass http://wallpaper-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://wallpaper-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location /uploads/ {
        proxy_pass http://wallpaper-backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

# ========================================================
# HTTPS (443端口): 客户端商城前台 (wallpaper.icangoanyway.com)
# ========================================================
server {
    listen 443 ssl;
    http2 on;
    server_name wallpaper.icangoanyway.com ios.icangoanyway.com;
    client_max_body_size 100M;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 客户端静态页面 (Uni-app 5173 前台)
    location / {
        proxy_pass http://wallpaper-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API 接口统一转发至后端
    location /api/ {
        proxy_pass http://wallpaper-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态上传资源文件
    location /uploads/ {
        proxy_pass http://wallpaper-backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
    }
}

